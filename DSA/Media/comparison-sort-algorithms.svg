  <text class="algo" x="62" y="646">Tim Sort</text>
  <text class="cell-text" x="260" y="646">Real-world lists</text>
  <rect class="chip-good" x="520" y="624" width="92" height="40" rx="20"/>
  <text class="chip-text" x="550" y="650">O(n)</text>
  <rect class="chip-mid" x="670" y="624" width="112" height="40" rx="20"/>
  <text class="chip-small" x="690" y="650">O(n log n)</text>
  <rect class="chip-mid" x="835" y="624" width="112" height="40" rx="20"/>
