  <text class="algo" x="62" y="717">Shell Sort</text>
  <text class="cell-text" x="260" y="717">Gap sequence</text>
  <rect class="chip-mid" x="510" y="695" width="112" height="40" rx="20"/>
  <text class="chip-small" x="530" y="721">O(n log n)</text>
  <rect class="chip-warn" x="670" y="695" width="112" height="40" rx="20"/>
