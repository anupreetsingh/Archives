  <text class="algo" x="62" y="433">Merge Sort</text>
  <text class="cell-text" x="260" y="433">Any list</text>
  <rect class="chip-mid" x="510" y="411" width="112" height="40" rx="20"/>
  <text class="chip-small" x="530" y="437">O(n log n)</text>
  <rect class="chip-mid" x="670" y="411" width="112" height="40" rx="20"/>
  <text class="chip-small" x="690" y="437">O(n log n)</text>
  <rect class="chip-mid" x="835" y="411" width="112" height="40" rx="20"/>
  <text class="chip-small" x="855" y="437">O(n log n)</text>
  <rect class="chip-mid" x="1000" y="411" width="92" height="40" rx="20"/>
  <text class="chip-text" x="1030" y="437">O(n)</text>
  <rect class="chip-mid" x="1150" y="411" width="92" height="40" rx="20"/>
  <text class="chip-text" x="1180" y="437">O(n)</text>
  <rect class="chip-mid" x="1300" y="411" width="92" height="40" rx="20"/>
  <text class="chip-text" x="1330" y="437">O(n)</text>

  <text class="algo" x="62" y="504">Quick Sort</text>
  <text class="cell-text" x="260" y="504">Any list</text>
  <rect class="chip-mid" x="510" y="482" width="112" height="40" rx="20"/>
  <text class="chip-small" x="530" y="508">O(n log n)</text>
  <rect class="chip-mid" x="670" y="482" width="112" height="40" rx="20"/>
  <text class="chip-small" x="690" y="508">O(n log n)</text>
  <rect class="chip-bad" x="845" y="482" width="92" height="40" rx="20"/>
  <text class="chip-text" x="871" y="508">O(n^2)</text>
  <rect class="chip-mid" x="1000" y="482" width="92" height="40" rx="20"/>
  <text class="chip-text" x="1030" y="508">O(n)</text>
  <rect class="chip-mid" x="1150" y="482" width="92" height="40" rx="20"/>
  <text class="chip-text" x="1180" y="508">O(n)</text>
  <rect class="chip-mid" x="1300" y="482" width="92" height="40" rx="20"/>
