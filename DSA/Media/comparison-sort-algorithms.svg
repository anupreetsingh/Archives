  <text class="algo" x="62" y="575">Heap Sort</text>
  <text class="cell-text" x="260" y="575">Any list</text>
  <rect class="chip-mid" x="510" y="553" width="112" height="40" rx="20"/>
  <text class="chip-small" x="530" y="579">O(n log n)</text>
  <rect class="chip-mid" x="670" y="553" width="112" height="40" rx="20"/>
  <text class="chip-small" x="690" y="579">O(n log n)</text>
  <rect class="chip-mid" x="835" y="553" width="112" height="40" rx="20"/>
  <text class="chip-small" x="855" y="579">O(n log n)</text>
  <rect class="chip-good" x="1000" y="553" width="92" height="40" rx="20"/>
  <text class="chip-text" x="1030" y="579">O(1)</text>
  <rect class="chip-good" x="1150" y="553" width="92" height="40" rx="20"/>
  <text class="chip-text" x="1180" y="579">O(1)</text>
  <rect class="chip-good" x="1300" y="553" width="92" height="40" rx="20"/>
