  <rect class="chip-warn" x="845" y="340" width="92" height="40" rx="20"/>
  <text class="chip-text" x="871" y="366">O(n^2)</text>
  <rect class="chip-good" x="1000" y="340" width="92" height="40" rx="20"/>
  <text class="chip-text" x="1030" y="366">O(1)</text>
  <rect class="chip-good" x="1150" y="340" width="92" height="40" rx="20"/>
  <text class="chip-text" x="1180" y="366">O(1)</text>
  <rect class="chip-good" x="1300" y="340" width="92" height="40" rx="20"/>
