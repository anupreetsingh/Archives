<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
  <title id="title">Non-Comparison Sort Complexity</title>
  <desc id="desc">Non-comparison sorting algorithms compared by best, average, and worst case for both time and space complexity.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .group { fill: #e2e8f0; }
    .subhead { fill: #f1f5f9; }
    .title { fill: #0f172a; font: 700 34px Arial, sans-serif; }
    .header-text { fill: #0f172a; font: 700 17px Arial, sans-serif; }
    .subhead-text { fill: #334155; font: 700 13px Arial, sans-serif; }
    .cell-text { fill: #1e293b; font: 600 18px Arial, sans-serif; }
    .algo { fill: #0f172a; font: 700 21px Arial, sans-serif; }
    .chip-good { fill: #dcfce7; stroke: #86efac; stroke-width: 1; }
    .chip-mid { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; }
    .chip-warn { fill: #fef3c7; stroke: #fcd34d; stroke-width: 1; }
    .chip-bad { fill: #fee2e2; stroke: #fca5a5; stroke-width: 1; }
    .chip-text { fill: #0f172a; font: 700 15px Arial, sans-serif; }
    .chip-small { fill: #0f172a; font: 700 13px Arial, sans-serif; }
    .line { stroke: #cbd5e1; stroke-width: 1; }
  </style>

  <rect class="bg" width="1440" height="430"/>

  <text class="title" x="48" y="62">Non-Comparison Sort Algorithms</text>

  <rect class="panel" x="40" y="100" width="1360" height="290" rx="10"/>

  <rect class="group" x="40" y="100" width="1360" height="42" rx="10"/>
  <rect class="group" x="40" y="128" width="1360" height="14"/>
  <rect class="subhead" x="40" y="142" width="1360" height="34"/>

  <text class="header-text" x="62" y="127">Algorithm</text>
  <text class="header-text" x="260" y="127">Input</text>
  <text class="header-text" x="565" y="127">Time Complexity</text>
  <text class="header-text" x="1040" y="127">Space Complexity</text>

  <text class="subhead-text" x="522" y="164">Best</text>
  <text class="subhead-text" x="680" y="164">Average</text>
  <text class="subhead-text" x="845" y="164">Worst</text>
  <text class="subhead-text" x="1002" y="164">Best</text>
  <text class="subhead-text" x="1160" y="164">Average</text>
  <text class="subhead-text" x="1320" y="164">Worst</text>

  <line class="line" x1="235" y1="100" x2="235" y2="390"/>
  <line class="line" x1="500" y1="100" x2="500" y2="390"/>
  <line class="line" x1="980" y1="100" x2="980" y2="390"/>
  <line class="line" x1="40" y1="176" x2="1400" y2="176"/>
  <line class="line" x1="40" y1="247" x2="1400" y2="247"/>
  <line class="line" x1="40" y1="318" x2="1400" y2="318"/>
  <line class="line" x1="650" y1="142" x2="650" y2="390"/>
  <line class="line" x1="815" y1="142" x2="815" y2="390"/>
  <line class="line" x1="1130" y1="142" x2="1130" y2="390"/>
  <line class="line" x1="1295" y1="142" x2="1295" y2="390"/>

  <text class="algo" x="62" y="220">Counting Sort</text>
  <text class="cell-text" x="260" y="220">Integer range k</text>
  <rect class="chip-mid" x="520" y="198" width="112" height="40" rx="20"/>
  <text class="chip-small" x="542" y="224">O(n + k)</text>
  <rect class="chip-mid" x="680" y="198" width="112" height="40" rx="20"/>
  <text class="chip-small" x="702" y="224">O(n + k)</text>
  <rect class="chip-mid" x="845" y="198" width="112" height="40" rx="20"/>
  <text class="chip-small" x="867" y="224">O(n + k)</text>
  <rect class="chip-mid" x="1000" y="198" width="112" height="40" rx="20"/>
  <text class="chip-small" x="1022" y="224">O(n + k)</text>
  <rect class="chip-mid" x="1150" y="198" width="112" height="40" rx="20"/>
  <text class="chip-small" x="1172" y="224">O(n + k)</text>
  <rect class="chip-mid" x="1300" y="198" width="92" height="40" rx="20"/>
  <text class="chip-small" x="1312" y="224">O(n + k)</text>

  <text class="algo" x="62" y="291">Radix Sort</text>
  <text class="cell-text" x="260" y="291">d digits, base b</text>
  <rect class="chip-mid" x="505" y="269" width="142" height="40" rx="20"/>
  <text class="chip-small" x="522" y="295">O(d(n + b))</text>
  <rect class="chip-mid" x="665" y="269" width="142" height="40" rx="20"/>
  <text class="chip-small" x="682" y="295">O(d(n + b))</text>
  <rect class="chip-mid" x="830" y="269" width="142" height="40" rx="20"/>
  <text class="chip-small" x="847" y="295">O(d(n + b))</text>
  <rect class="chip-mid" x="1000" y="269" width="112" height="40" rx="20"/>
  <text class="chip-small" x="1022" y="295">O(n + b)</text>
  <rect class="chip-mid" x="1150" y="269" width="112" height="40" rx="20"/>
  <text class="chip-small" x="1172" y="295">O(n + b)</text>
  <rect class="chip-mid" x="1300" y="269" width="92" height="40" rx="20"/>
  <text class="chip-small" x="1312" y="295">O(n + b)</text>

  <text class="algo" x="62" y="362">Bucket Sort</text>
  <text class="cell-text" x="260" y="362">Uniform keys</text>
  <rect class="chip-mid" x="520" y="340" width="112" height="40" rx="20"/>
  <text class="chip-small" x="542" y="366">O(n + k)</text>
  <rect class="chip-mid" x="680" y="340" width="112" height="40" rx="20"/>
  <text class="chip-small" x="702" y="366">O(n + k)</text>
  <rect class="chip-bad" x="845" y="340" width="92" height="40" rx="20"/>
  <text class="chip-text" x="871" y="366">O(n^2)</text>
  <rect class="chip-mid" x="1000" y="340" width="112" height="40" rx="20"/>
  <text class="chip-small" x="1022" y="366">O(n + k)</text>
  <rect class="chip-mid" x="1150" y="340" width="112" height="40" rx="20"/>
  <text class="chip-small" x="1172" y="366">O(n + k)</text>
  <rect class="chip-mid" x="1300" y="340" width="92" height="40" rx="20"/>
  <text class="chip-small" x="1312" y="366">O(n + k)</text>
</svg>
